name: Playwright Salesforce Tests

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Test tag to run (e.g. @smoke, @regression, @e2e)'
        required: true
        default: '@smoke'
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TEST_ENV: trial
      SF_BASE_URL: ${{ secrets.SF_BASE_URL }}
      SF_LOGIN_URL: ${{ secrets.SF_LOGIN_URL }}
      SF_USERNAME: ${{ secrets.SF_USERNAME }}
      SF_PASSWORD: ${{ secrets.SF_PASSWORD }}
      SF_MFA_SECRET: ${{ secrets.SF_MFA_SECRET }}
      SF_AUTH_TYPE: ${{ secrets.SF_AUTH_TYPE }}
      SSO_IDP_URL: ${{ secrets.SSO_IDP_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps
      - name: Run tests
        run: npx playwright test --grep "${{ github.event.inputs.tag || '@smoke' }}"
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 14
